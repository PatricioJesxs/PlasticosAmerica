# =============================================================================
# Plásticos América — stack completo (PostgreSQL + FastAPI + Next.js)
#
#   cp .env.example .env      # ajusta SECRET_KEY, contraseñas y dominio
#   docker compose up -d --build
#
# Frontend: http://localhost:3000   ·   API: http://localhost:8000/docs
# =============================================================================
services:
  db:
    image: postgres:16-alpine
    container_name: pa_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plasticos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plasticos}
      POSTGRES_DB: ${POSTGRES_DB:-plasticos_america}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plasticos} -d ${POSTGRES_DB:-plasticos_america}"]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pa_api
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-plasticos}:${POSTGRES_PASSWORD:-plasticos}@db:5432/${POSTGRES_DB:-plasticos_america}
      SECRET_KEY: ${SECRET_KEY:-cambia-esta-clave-en-produccion}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      ACCESS_TOKEN_EXPIRE_DAYS_REMEMBER: ${ACCESS_TOKEN_EXPIRE_DAYS_REMEMBER:-30}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@plasticosamerica.cl}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin1234!}
      ADMIN_NOMBRE: ${ADMIN_NOMBRE:-Administrador Plásticos América}
      ADMIN_RUT: ${ADMIN_RUT:-11.111.111-1}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # URL pública de la API: el navegador del cliente debe poder resolverla.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: pa_web
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  # (Los archivos subidos viven en el volumen del servicio api)

volumes:
  pgdata:
  uploads:
