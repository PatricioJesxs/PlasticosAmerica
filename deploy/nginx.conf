# =============================================================================
# Plásticos América — proxy inverso Nginx (VPS con Docker Compose)
#
# 1. Copia este archivo a /etc/nginx/sites-available/plasticosamerica.cl
# 2. Reemplaza plasticosamerica.cl por tu dominio real.
# 3. ln -s /etc/nginx/sites-available/plasticosamerica.cl /etc/nginx/sites-enabled/
# 4. nginx -t && systemctl reload nginx
# 5. HTTPS: certbot --nginx -d plasticosamerica.cl -d www.plasticosamerica.cl
# =============================================================================

upstream pa_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream pa_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name plasticosamerica.cl www.plasticosamerica.cl;

    client_max_body_size 20m;

    # Documentación y API
    location /api/ {
        proxy_pass http://pa_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://pa_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Aplicación Next.js
    location / {
        proxy_pass http://pa_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache de estáticos de Next.js
    location /_next/static/ {
        proxy_pass http://pa_web;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
